services:
  radio-api:
    build: .
    container_name: uganda-radio-api
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: sqlite:////app/data/radio.db
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://rizfm.pkasemer.com}
      APP_NAME: ${APP_NAME:-RIZFM}
      PRIVACY_OPERATOR_NAME: ${PRIVACY_OPERATOR_NAME:-RIZFM}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    volumes:
      - radio-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Measures how loud each station is (LUFS) with ffmpeg, on a schedule, and stores the result.
  # It only reports a number: it never touches the audio listeners hear.
  loudness-worker:
    build: .
    container_name: uganda-radio-loudness
    command: ["python", "-m", "app.loudness_worker"]
    environment:
      DATABASE_URL: sqlite:////app/data/radio.db
      LOUDNESS_SLOTS: ${LOUDNESS_SLOTS:-06:00,12:00,18:00,23:00}
      LOUDNESS_POLL_SECONDS: ${LOUDNESS_POLL_SECONDS:-30}
    volumes:
      - radio-data:/app/data
    depends_on:
      radio-api:
        condition: service_healthy
    restart: unless-stopped

  # Checks that every station's stream really works (audio bytes arrive, not just a URL that answers)
  # every 5 minutes, and stores the status. Set HEALTH_ALERT_WEBHOOK_URL to get chat alerts.
  health-worker:
    build: .
    container_name: uganda-radio-health
    command: ["python", "-m", "app.health_worker"]
    environment:
      DATABASE_URL: sqlite:////app/data/radio.db
      HEALTH_ALERT_WEBHOOK_URL: ${HEALTH_ALERT_WEBHOOK_URL:-}
      HEALTH_HEALTHY_INTERVAL: ${HEALTH_HEALTHY_INTERVAL:-300}
      HEALTH_SUSPECT_INTERVAL: ${HEALTH_SUSPECT_INTERVAL:-60}
      HEALTH_OFFLINE_INTERVAL: ${HEALTH_OFFLINE_INTERVAL:-900}
    volumes:
      - radio-data:/app/data
    depends_on:
      radio-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  radio-data:
