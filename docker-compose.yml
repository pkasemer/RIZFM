services:
  radio-api:
    build: .
    container_name: uganda-radio-api
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: sqlite:////app/data/radio.db
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://rizfm.pkasemer.com}
      APP_NAME: ${APP_NAME:-SOFIZ FM}
      PRIVACY_OPERATOR_NAME: ${PRIVACY_OPERATOR_NAME:-SOFIZ FM}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    volumes:
      - radio-data:/app/data
    restart: unless-stopped

volumes:
  radio-data:
